<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - E+Learn</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-book"></i>
        </div>

        <h1 class="app-title">E+Learn</h1>
        <p class="app-subtitle">Sign in to your account</p>

        <!-- LOGIN FORM -->
        <form class="login-form" onsubmit="loginUser(event)">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html" class="link-signup">Sign up</a>
        </div>
    </div>

    <!-- ROLE VALIDATION SCRIPT -->
    <script>
        function loginUser(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            // SAMPLE ACCOUNTS (You can edit these)
            const users = [
                {
                    role: "admin",
                    email: "admin@elearn.com",
                    password: "admin123",
                    redirect: "admin/admin.html"
                },
                {
                    role: "student",
                    email: "student@elearn.com",
                    password: "student123",
                    redirect: "STUDENT/dashboard.html"
                },
                {
                    role: "teacher",
                    email: "teacher@elearn.com",
                    password: "teacher123",
                    redirect: "teacher/index.html"
                }
            ];

            // CHECK IF CREDENTIALS MATCH ANY USER
            const foundUser = users.find(
                user => user.email === email && user.password === password
            );

            // IF NOT FOUND → ERROR
            if (!foundUser) {
                alert("Invalid email or password. Try again.");
                return;
            }

            // IF FOUND → REDIRECT BASED ON ROLE
            window.location.href = foundUser.redirect;
        }
    </script>

</body>
</html>
