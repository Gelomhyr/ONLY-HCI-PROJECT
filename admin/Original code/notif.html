<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - E+Learn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="css/notif.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>
<body class="bg-gray-50 text-slate-800">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#6384FF] text-white flex-shrink-0 hidden md:flex flex-col transition-all duration-300">
            <div class="p-6 flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-lg">
                    <i class="fa-solid fa-book text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">E+Learn</h1>
                    <p class="text-xs text-blue-100">Admin Portal</p>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="admin.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-blue-100 transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    Dashboard
                </a>
                <a href="user.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-blue-100 transition-colors">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    User Management
                </a>
                <a href="course.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-blue-100 transition-colors">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                    Course Management
                </a>
                <a href="announcement.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-blue-100 transition-colors">
                    <i data-lucide="megaphone" class="w-5 h-5"></i>
                    Announcements
                </a>
                <a href="report.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-blue-100 transition-colors">
                    <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                    Reports & Analytics
                </a>
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-blue-100 transition-colors">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    System Settings
                </a>
                <!-- Active State -->
                 <a href="#" class="flex items-center gap-3 px-4 py-3 bg-white/10 rounded-lg text-white font-medium">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    Notifications
                </a>
                 <a href="message.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-blue-100 transition-colors">
                    <i data-lucide="message-square" class="w-5 h-5"></i>
                    Messaging
                </a>
            </nav>

            <div class="p-4 mt-auto">
                <div class="flex items-center gap-3 px-4 py-3 mb-2">
                    <div class="w-8 h-8 rounded-full bg-blue-400 flex items-center justify-center text-xs font-bold">AU</div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-medium truncate">Admin User</p>
                        <p class="text-xs text-blue-200 truncate">admin@gmail.com</p>
                    </div>
                </div>
                <a href="../login.html" class="flex items-center gap-2 px-4 py-2 text-sm text-blue-200 hover:text-white transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 h-full overflow-y-auto overflow-x-hidden bg-white md:bg-gray-50">
             <!-- Mobile Header -->
             <div class="md:hidden bg-[#6384FF] text-white p-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-book text-lg"></i>
                    <span class="font-bold">E+Learn</span>
                </div>
                <button class="p-1"><i data-lucide="menu" class="w-6 h-6"></i></button>
            </div>

            <div class="p-6 max-w-[1600px] mx-auto space-y-6">
                
                <!-- Page Header -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <h2 class="text-2xl font-bold text-gray-900">Notifications</h2>
                        <span id="headerBadge" class="px-2 py-1 bg-[#819CFF] text-white text-xs font-semibold rounded-md hidden">2 new</span>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <button onclick="markAllRead()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-50 transition-colors">
                            <i data-lucide="check-check" class="w-4 h-4"></i>
                            Mark All Read
                        </button>
                        <button onclick="clearAll()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-sm hover:bg-red-50 hover:text-red-600 hover:border-red-100 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                            Clear All
                        </button>
                    </div>
                </div>

                <p class="text-gray-500 text-sm -mt-4">Stay updated with platform activity</p>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Total -->
                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                                <i data-lucide="bell" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase">Total</p>
                                <h3 class="text-2xl font-bold text-gray-900" id="totalCount">5</h3>
                            </div>
                        </div>
                    </div>
                    <!-- Unread -->
                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-yellow-50 text-yellow-600 rounded-xl">
                                <i data-lucide="bell-ring" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase">Unread</p>
                                <h3 class="text-2xl font-bold text-gray-900" id="unreadCount">2</h3>
                            </div>
                        </div>
                    </div>
                    <!-- Read -->
                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-green-50 text-green-600 rounded-xl">
                                <i data-lucide="check" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase">Read</p>
                                <h3 class="text-2xl font-bold text-gray-900" id="readCount">3</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notification List -->
                <div id="notificationList" class="space-y-4">
                    <!-- Items injected via JS -->
                </div>

                <div class="h-6"></div>
            </div>
        </main>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Data
        let notifications = [
            {
                id: 1,
                title: "New Student Registration",
                desc: "John Smith has registered for Web Development course",
                time: "2 minutes ago",
                unread: true,
                icon: "user-plus",
                iconColor: "text-yellow-600",
                iconBg: "bg-yellow-50"
            },
            {
                id: 2,
                title: "Course Update",
                desc: "Data Science course materials have been updated",
                time: "15 minutes ago",
                unread: true,
                icon: "bell",
                iconColor: "text-blue-600",
                iconBg: "bg-blue-50"
            },
            {
                id: 3,
                title: "Certificate Issued",
                desc: "Certificate issued to Sarah Johnson for completing UI/UX Design",
                time: "1 hour ago",
                unread: false,
                icon: "award",
                iconColor: "text-yellow-600",
                iconBg: "bg-yellow-50"
            },
            {
                id: 4,
                title: "System Maintenance",
                desc: "Scheduled maintenance will begin in 24 hours",
                time: "2 hours ago",
                unread: false,
                icon: "alert-circle",
                iconColor: "text-orange-600",
                iconBg: "bg-orange-50"
            },
            {
                id: 5,
                title: "New Teacher Enrolled",
                desc: "Dr. Emily Brown has joined as a teacher",
                time: "3 hours ago",
                unread: false,
                icon: "bell",
                iconColor: "text-blue-600",
                iconBg: "bg-blue-50"
            }
        ];

        const listContainer = document.getElementById('notificationList');
        const totalCountEl = document.getElementById('totalCount');
        const unreadCountEl = document.getElementById('unreadCount');
        const readCountEl = document.getElementById('readCount');
        const headerBadge = document.getElementById('headerBadge');

        function updateStats() {
            const total = notifications.length;
            const unread = notifications.filter(n => n.unread).length;
            const read = total - unread;

            totalCountEl.textContent = total;
            unreadCountEl.textContent = unread;
            readCountEl.textContent = read;

            if (unread > 0) {
                headerBadge.textContent = `${unread} new`;
                headerBadge.classList.remove('hidden');
            } else {
                headerBadge.classList.add('hidden');
            }
        }

        function renderNotifications() {
            listContainer.innerHTML = '';
            
            if (notifications.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i data-lucide="bell-off" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                        <p>No notifications found.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            notifications.forEach(item => {
                const itemEl = document.createElement('div');
                // Base Classes
                let classes = "notification-item bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md flex items-start gap-4 relative overflow-hidden group";
                
                // Unread Styling (Blue border left)
                if (item.unread) {
                    classes += " border-l-4 border-l-[#6384FF]";
                } else {
                    classes += " border-l-4 border-l-transparent";
                }

                itemEl.className = classes;
                itemEl.setAttribute('id', `notif-${item.id}`);

                // Conditional HTML
                const badgeHtml = item.unread ? `<span class="bg-[#FEF9C3] text-[#854D0E] text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">New</span>` : '';
                
                const markReadBtn = item.unread ? `
                    <button onclick="markAsRead(${item.id})" class="flex items-center gap-1 text-xs font-medium text-gray-400 hover:text-blue-600 transition-colors mr-4">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                        Mark Read
                    </button>
                ` : '';

                itemEl.innerHTML = `
                    <!-- Icon -->
                    <div class="flex-shrink-0 p-2.5 ${item.iconBg} ${item.iconColor} rounded-lg">
                        <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                    </div>
                    
                    <!-- Content -->
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-sm font-bold text-gray-900 mb-0.5 flex items-center gap-2">
                                    ${item.title}
                                    ${badgeHtml}
                                </h4>
                                <p class="text-sm text-gray-500 line-clamp-1">${item.desc}</p>
                                <p class="text-xs text-gray-400 mt-2">${item.time}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center self-center md:self-start mt-2 md:mt-0">
                        ${markReadBtn}
                        <button onclick="deleteNotification(${item.id})" class="text-gray-300 hover:text-red-500 transition-colors p-1 rounded-md hover:bg-red-50">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(itemEl);
            });
            lucide.createIcons();
        }

        // Actions
        window.markAsRead = (id) => {
            const notif = notifications.find(n => n.id === id);
            if (notif) {
                notif.unread = false;
                renderNotifications();
                updateStats();
            }
        };

        window.markAllRead = () => {
            notifications.forEach(n => n.unread = false);
            renderNotifications();
            updateStats();
        };

        window.deleteNotification = (id) => {
            const el = document.getElementById(`notif-${id}`);
            el.classList.add('removing'); // Trigger CSS transition
            
            setTimeout(() => {
                notifications = notifications.filter(n => n.id !== id);
                renderNotifications();
                updateStats();
            }, 300); // Wait for animation
        };

        window.clearAll = () => {
            if(confirm("Are you sure you want to clear all notifications?")) {
                notifications = [];
                renderNotifications();
                updateStats();
            }
        };

        // Initial Render
        renderNotifications();
        updateStats();

    </script>
</body>
</html>
